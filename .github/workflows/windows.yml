name: Windows

# Builds the Windows app and publishes the installer.
# Triggered by tags like `windows-v0.1.0`; the macOS workflows are untouched.

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: write

# Publishing is on: Microsoft reviewed the Defender false positive
# (Trojan:Win32/Wacatac.H!ml) and removed the detection. Before pushing a
# windows-v* tag, run this workflow by hand and scan the artifacts with Defender:
# a new unsigned build can still trip its machine-learning model. Set this to
# 'false' to build tags without publishing.
env:
  PUBLISH: 'true'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop-windows

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-windows/target
          key: windows-cargo-${{ hashFiles('apps/desktop-windows/src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: pnpm install

      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      - name: Build and pack the installer
        id: pack
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: HeyCleo-Windows-setup
          path: apps/desktop-windows/release/HeyCleo-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: HeyCleo-Windows-msi
          path: apps/desktop-windows/release/HeyCleo-${{ steps.pack.outputs.version }}.msi
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: HeyCleo-Windows-portable
          path: apps/desktop-windows/release/HeyCleo-${{ steps.pack.outputs.version }}.exe
          retention-days: 3

      - name: Publish the release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $notes = @"
          HeyCleo for Windows $v — Intelligent on-screen AI companion.

          Download ``HeyCleo-$v.msi`` (Windows Installer) or ``HeyCleo-$v-setup.exe``.
          Automatic in-app updates are enabled for all future releases!
          "@
          $assets = @(
            "release/HeyCleo-$v-setup.exe",
            "release/HeyCleo-$v.msi",
            "release/HeyCleo-$v.exe"
          )
          if (Test-Path "release/HeyCleo-$v-setup.exe.sig") {
            $assets += "release/HeyCleo-$v-setup.exe.sig"
          }
          if (Test-Path "release/latest.json") {
            $assets += "release/latest.json"
          }
          gh release create "${{ github.ref_name }}" `
            $assets `
            --title "HeyCleo for Windows $v" `
            --notes $notes `
            --latest=true

      - name: Update the rolling windows-latest release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $assets = @(
            "release/HeyCleo-setup.exe",
            "release/HeyCleo.msi",
            "release/HeyCleo.exe"
          )
          if (Test-Path "release/HeyCleo-setup.exe.sig") {
            $assets += "release/HeyCleo-setup.exe.sig"
          }
          if (Test-Path "release/latest.json") {
            $assets += "release/latest.json"
          }
          $exists = gh release view windows-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            git tag -f windows-latest "${{ github.sha }}"
            git push -f origin windows-latest
            gh release edit windows-latest --title "HeyCleo for Windows (latest)" --notes "Always the newest Windows build — currently $v."
            gh release upload windows-latest $assets --clobber
          } else {
            gh release create windows-latest `
              $assets `
              --title "HeyCleo for Windows (latest)" `
              --notes "Always the newest Windows build — currently $v." `
              --latest=false
          }
